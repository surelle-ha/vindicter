[package]
name = "vindicta"
version = "0.4.0"
description = "Vindicta — local-first AI-powered security platform"
authors = ["Vindicter"]
edition = "2021"

[package.metadata.tauri]
windows-resource = true

[lib]
name = "vindicta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vindicta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.3", features = ["json"] }
